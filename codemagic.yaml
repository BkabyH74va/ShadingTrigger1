workflows:
  ios-ipa:
    name: iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Find Xcode project
        script: |
          set -e
          PROJECT_PATH="$(find . -maxdepth 3 -name '*.xcodeproj' -print -quit)"
          if [ -z "$PROJECT_PATH" ]; then
            echo "No Xcode project found"
            exit 1
          fi
          echo "Using project: $PROJECT_PATH"

      - name: Configure signing
        script: |
          xcode-project use-profiles --warn-only

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "./ShadingTrigger.xcodeproj" \
            --scheme "ShadingTrigger"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
