name: ShadingTrigger1
options:
  bundleIdPrefix: com.jasonquiles
  deploymentTarget:
    iOS: "15.0"

targets:
  ShadingTrigger1:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "Info.plist"
    info:
      path: Info.plist
      properties:
        CFBundleName: ShadingTrigger1
        CFBundleDisplayName: ShadingTrigger1
        CFBundleIdentifier: com.jasonquiles.ShadingTrigger1
        CFBundleVersion: 1
        CFBundleShortVersionString: 1.0
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasonquiles.ShadingTrigger1
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
