name: SafeShadingDemo
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  SafeShadingDemo:
    type: application
    platform: iOS
    sources:
      - path: SafeShadingDemoApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.safeshadingdemo
        PRODUCT_NAME: SafeShadingDemo
        INFOPLIST_KEY_CFBundleDisplayName: Safe Shading Demo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
