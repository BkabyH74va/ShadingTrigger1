      - name: Fix bundle ID in built app
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          
          # Find the built .app
          APP_PATH=$(find build -name "SafeShadingDemo.app" -type d -path "*/Release-iphoneos/*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            exit 1
          fi
          
          echo "Found app: $APP_PATH"
          
          # Patch Info.plist to force string bundle ID
          PLIST_PATH="$APP_PATH/Info.plist"
          
          # Convert to XML, patch, convert back
          plutil -convert xml1 "$PLIST_PATH"
          
          # Use Python to ensure CFBundleIdentifier is a string
          python3 << 'EOF'
import plistlib
import sys

plist_path = sys.argv[1]

with open(plist_path, 'rb') as f:
    plist = plistlib.load(f)

# Force CFBundleIdentifier to be a clean string
plist['CFBundleIdentifier'] = 'com.jasonquiles.SafeShadingDemo'

# Remove any problematic keys
plist.pop('CFBundleExecutable', None)
plist['CFBundleExecutable'] = 'SafeShadingDemo'

with open(plist_path, 'wb') as f:
    plistlib.dump(plist, f)

print(f"Patched: {plist_path}")
print(f"Bundle ID: {plist['CFBundleIdentifier']}")
EOF
          
          # Also patch the binary if it has embedded bundle ID
          BINARY_PATH="$APP_PATH/SafeShadingDemo"
          if [ -f "$BINARY_PATH" ]; then
            # Replace any occurrence of bundle ID with team ID suffix
            python3 << 'EOF'
import sys

binary_path = sys.argv[1]

with open(binary_path, 'rb') as f:
    data = f.read()

# Look for bundle ID patterns and log them
import re
patterns = re.findall(b'com\.jasonquiles\.SafeShadingDemo[^\x00]*', data)
for p in patterns:
    print(f"Found in binary: {p}")

print("Binary checked")
EOF
          fi
          
          echo "Bundle ID patched successfully"
