name: Build iOS exploit IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "SafeShadingDemo/**"
      - ".github/workflows/ios-ipa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain and structure
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          uname -m
          echo "=== Repo root ==="
          ls -la
          echo "=== SafeShadingDemo folder ==="
          ls -la SafeShadingDemo/ 2>/dev/null || echo "Not found"
          echo "=== Inner SafeShadingDemo folder ==="
          ls -la SafeShadingDemo/SafeShadingDemo/ 2>/dev/null || echo "Not found"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -e
          cd SafeShadingDemo/SafeShadingDemo
          echo "=== Current directory ==="
          pwd
          echo "=== Files before xcodegen ==="
          ls -la
          echo "=== project.yml contents ==="
          cat project.yml
          echo "=== Running xcodegen ==="
          xcodegen generate
          echo "=== Exit code: $? ==="
          echo "=== Files after xcodegen ==="
          ls -la
          echo "=== Find .xcodeproj ==="
          find . -name "*.xcodeproj" -type d 2>/dev/null || true
          find .. -name "*.xcodeproj" -type d 2>/dev/null || true

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          cd SafeShadingDemo/SafeShadingDemo
          echo "=== Looking for .xcodeproj ==="
          find . -name "*.xcodeproj" -type d
          PROJECT_PATH=$(find . -name "*.xcodeproj" -type d -print -quit)
          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: No .xcodeproj found"
            exit 1
          fi
          echo "Found project: $PROJECT_PATH"
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme SafeShadingDemo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/SafeShadingDemo.app"
          test -d "$APP_PATH"
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/ipa/Payload/"
          cd "$GITHUB_WORKSPACE/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/SafeShadingDemo-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeShadingDemo-unsigned-IPA
          path: SafeShadingDemo-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
