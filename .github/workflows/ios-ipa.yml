name: Build iOS exploit IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "SafeShadingDemo/**"
      - ".github/workflows/ios-ipa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain and structure
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          uname -m
          echo "=== Repo root ==="
          ls -la
          echo "=== SafeShadingDemo folder ==="
          ls -la SafeShadingDemo/ 2>/dev/null || echo "Not found"
          echo "=== Inner folder ==="
          ls -la SafeShadingDemo/SafeShadingDemo/ 2>/dev/null || echo "Not found"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -e
          cd SafeShadingDemo/SafeShadingDemo
          echo "=== Current directory ==="
          pwd
          echo "=== Files before xcodegen ==="
          ls -la
          xcodegen generate
          echo "=== Files after xcodegen ==="
          ls -la
          echo "=== Find .xcodeproj ==="
          find . -name "*.xcodeproj" -type d

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          cd SafeShadingDemo/SafeShadingDemo
          PROJECT_PATH=$(find . -name "*.xcodeproj" -type d -print -quit)
          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: No .xcodeproj found"
            exit 1
          fi
          echo "Building: $PROJECT_PATH"
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme SafeShadingDemo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Fix bundle ID in built app
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          
          APP_PATH=$(find build -name "SafeShadingDemo.app" -type d -path "*/Release-iphoneos/*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            exit 1
          fi
          
          echo "Found app: $APP_PATH"
          
          PLIST_PATH="$APP_PATH/Info.plist"
          plutil -convert xml1 "$PLIST_PATH"
          
          # Use plutil to set values directly
          plutil -replace CFBundleIdentifier -string "com.jasonquiles.SafeShadingDemo" "$PLIST_PATH"
          plutil -replace CFBundleExecutable -string "SafeShadingDemo" "$PLIST_PATH"
          
          echo "=== Patched Info.plist ==="
          plutil -p "$PLIST_PATH"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          
          APP_PATH=$(find build -name "SafeShadingDemo.app" -type d -path "*/Release-iphoneos/*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            find build -name "*.app" -type d
            exit 1
          fi
          echo "Found app: $APP_PATH"
          
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/
          
          echo "=== IPA Payload ==="
          ls -la ipa/Payload/
          
          cd ipa
          zip -r ../SafeShadingDemo-unsigned.ipa Payload
          cd ..
          
          echo "=== IPA file ==="
          ls -lh SafeShadingDemo-unsigned.ipa
          echo "=== IPA contents ==="
          unzip -l SafeShadingDemo-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeShadingDemo-unsigned-IPA
          path: SafeShadingDemo-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
